groups:
  - name: gpu-fleet
    rules:
      - alert: GPUXidDetected
        expr: (DCGM_EXP_XID_ERRORS_COUNT > 0) or (DCGM_FI_DEV_XID_ERRORS > 0)
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} reported XID {{ $value }}"
          description: "Drain the GPU node and preserve driver/DCGM logs before reset."

      - alert: GPUUncorrectableECC
        expr: (DCGM_FI_DEV_ECC_DBE_VOL_TOTAL > 0) or (DCGM_FI_DEV_ECC_DBE_AGG_TOTAL > 0)
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} has an uncorrectable ECC count"
          description: "Drain the node and follow the vendor diagnostic/RMA workflow."

      - alert: GPUThermalOrPowerThrottling
        expr: (rate(DCGM_FI_DEV_THERMAL_VIOLATION[5m]) > 0) or (rate(DCGM_FI_DEV_POWER_VIOLATION[5m]) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} has sustained thermal or power limiting"
          description: "Violation time has continued increasing for more than five minutes."

      - alert: GPUPowerCapHit
        expr: increase(DCGM_FI_DEV_POWER_VIOLATION[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} hit its power cap"
          description: "Correlate the event with workload, clocks, cooling, and configured power limit."

      - alert: GPUExporterMissing
        expr: absent(up{job="dcgm-exporter"}) or max(up{job="dcgm-exporter"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DCGM exporter is missing"
          description: "Prometheus has no healthy dcgm-exporter scrape target."

      # This scaffold expects the one RTX 4060. Change 1 to the node's expected
      # physical GPU count before deploying it on the 8-GPU H100 nodes.
      - alert: GPUCountBelowExpected
        expr: count(DCGM_FI_DEV_GPU_UTIL) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Fewer GPUs exported than configured"
          description: "DCGM is exporting {{ $value }} GPUs; this rule currently expects at least one."
